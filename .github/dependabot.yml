# Keeps Wicket, Spring Boot, the build plugins and the workflow actions current. Every update is
# built by the Build workflow, including the integration test, before it can be merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.sonatype.central:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
